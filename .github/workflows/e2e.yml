name: E2E

# Playwright end-to-end tests. Independent of the deploy pipeline — a red run
# here does NOT block gh-pages (the client-only suite imports a synthetic
# bundle; no secrets required). Promote to a required check once it's stable.
# Push to master only. PRs (esp. Dependabot/forks) can't read the Firebase
# secrets the dev server needs, so a PR run would just white-screen.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          # The dev server (next dev) needs the public Firebase config or
          # getAuth() throws at module load and the whole app white-screens.
          # These NEXT_PUBLIC_* values ship in the deployed bundle (not secret);
          # mirrored from ci.yml so the app boots.
          #
          # The app DOES reach for Firebase on load — it mints an anonymous
          # session for the free proxy tier — so the suite intercepts that and
          # answers it locally (e2e/fixtures/firebase-auth.ts). Without it every
          # run created real anonymous accounts in the production project and
          # eventually tripped the sign-up rate limit, which is what made the
          # AI specs fail in a block and the whole run take 40+ minutes.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
