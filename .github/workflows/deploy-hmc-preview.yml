name: Deploy HMC pilot preview

# The workflow definition lives on protected master. An unprivileged signal
# workflow fires after either pilot branch changes. Source access, pilot code
# execution, and site publishing remain separate so pilot code sees no secrets.
on:
  workflow_run:
    workflows:
      - HMC preview change signal
    types:
      - completed
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hmc-pilot-preview
  cancel-in-progress: true

jobs:
  resolve:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app_sha: ${{ steps.revisions.outputs.app_sha }}
      personalization_sha: ${{ steps.revisions.outputs.personalization_sha }}
      changed: ${{ steps.freshness.outputs.changed }}
    steps:
      - name: Checkout HMC app source
        uses: actions/checkout@v7
        with:
          ref: pilot/hmc
          path: app
          persist-credentials: false

      - name: Checkout HMC personalization source
        uses: actions/checkout@v7
        with:
          repository: voho0000/mediprisma-personalization
          ref: pilot/hmc
          ssh-key: ${{ secrets.HMC_PERSONALIZATION_DEPLOY_KEY }}
          path: personalization
          persist-credentials: false

      - name: Resolve pilot revisions
        id: revisions
        shell: bash
        run: |
          echo "app_sha=$(git -C app rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "personalization_sha=$(git -C personalization rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check whether preview is current
        id: freshness
        env:
          APP_SHA: ${{ steps.revisions.outputs.app_sha }}
          PERSONALIZATION_SHA: ${{ steps.revisions.outputs.personalization_sha }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          marker="$(curl --fail --silent --show-error \
            'https://mediprisma.tw/app-hmc/hmc-build.json' 2>/dev/null || true)"
          deployed_app="$(printf '%s' "$marker" | jq -r '.appSha // empty' 2>/dev/null || true)"
          deployed_personalization="$(printf '%s' "$marker" | jq -r '.personalizationSha // empty' 2>/dev/null || true)"

          if [ "$APP_SHA" = "$deployed_app" ] && [ "$PERSONALIZATION_SHA" = "$deployed_personalization" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive pinned source without credentials
        if: steps.freshness.outputs.changed == 'true'
        shell: bash
        run: |
          git -C app archive --format=tar.gz --output="$GITHUB_WORKSPACE/app-source.tar.gz" HEAD
          git -C personalization archive --format=tar.gz --output="$GITHUB_WORKSPACE/personalization-source.tar.gz" HEAD

      - name: Upload source snapshot
        if: steps.freshness.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: hmc-source-${{ steps.revisions.outputs.app_sha }}
          path: |
            app-source.tar.gz
            personalization-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Report unchanged preview
        if: steps.freshness.outputs.changed != 'true'
        run: echo "HMC preview already matches both pilot branches."

  build:
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Download credential-free source snapshot
        uses: actions/download-artifact@v8
        with:
          name: hmc-source-${{ needs.resolve.outputs.app_sha }}
          path: source

      - name: Extract pinned source
        shell: bash
        run: |
          mkdir app personalization
          tar -xzf source/app-source.tar.gz -C app
          tar -xzf source/personalization-source.tar.gz -C personalization

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            personalization/package-lock.json

      - name: Align personalization source workspace versions
        working-directory: personalization
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises'
          import path from 'node:path'

          const packageRoot = path.resolve('packages')
          const directories = await readdir(packageRoot, { withFileTypes: true })
          const manifests = []
          const versions = new Map()

          for (const directory of directories.filter((entry) => entry.isDirectory())) {
            const manifestPath = path.join(packageRoot, directory.name, 'package.json')
            const manifest = JSON.parse(await readFile(manifestPath, 'utf8'))
            manifests.push({ manifestPath, manifest })
            versions.set(manifest.name, manifest.version)
          }

          for (const { manifestPath, manifest } of manifests) {
            for (const section of ['dependencies', 'devDependencies', 'peerDependencies']) {
              for (const dependency of Object.keys(manifest[section] ?? {})) {
                if (versions.has(dependency)) manifest[section][dependency] = versions.get(dependency)
              }
            }
            await writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`)
          }
          NODE

      - name: Install personalization dependencies from source workspaces
        working-directory: personalization
        shell: bash
        run: |
          cleanup_npmrc() {
            rm -f .npmrc
          }
          trap cleanup_npmrc EXIT
          rm -f .npmrc
          printf '%s\n' 'registry=https://registry.npmjs.org/' > .npmrc
          npm install --ignore-scripts --package-lock=false

      - name: Rebuild personalization dependencies
        working-directory: personalization
        run: npm rebuild

      - name: Verify and build HMC personalization
        working-directory: personalization
        run: npm run verify

      - name: Remove published source packages from app roots
        working-directory: app
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises'
          import path from 'node:path'

          const sourcePackageRoot = path.resolve('..', 'personalization', 'packages')
          const sourceDirectories = await readdir(sourcePackageRoot, { withFileTypes: true })
          const localPackages = []

          for (const directory of sourceDirectories.filter((entry) => entry.isDirectory())) {
            const manifestPath = path.join(sourcePackageRoot, directory.name, 'package.json')
            const sourceManifest = JSON.parse(await readFile(manifestPath, 'utf8'))
            if (!sourceManifest.name?.startsWith('@voho0000/')) {
              throw new Error(`Unexpected source package name at ${manifestPath}: ${sourceManifest.name}`)
            }
            localPackages.push(sourceManifest.name)
          }
          if (localPackages.length === 0) throw new Error('No personalization source packages found')

          const manifest = JSON.parse(await readFile('package.json', 'utf8'))
          const lockfile = JSON.parse(await readFile('package-lock.json', 'utf8'))

          for (const name of localPackages) {
            // The HF-only source slice is overlaid on this published package so
            // the app retains CKD and the other released disease packs.
            if (name === '@voho0000/personalized-care') continue
            delete manifest.dependencies?.[name]
            delete manifest.devDependencies?.[name]
            delete lockfile.packages?.['']?.dependencies?.[name]
            delete lockfile.packages?.['']?.devDependencies?.[name]
          }

          await writeFile('package.json', `${JSON.stringify(manifest, null, 2)}\n`)
          await writeFile('package-lock.json', `${JSON.stringify(lockfile, null, 2)}\n`)
          NODE

      - name: Install app dependencies
        working-directory: app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        shell: bash
        run: |
          cleanup_npmrc() {
            rm -f .npmrc
          }
          trap cleanup_npmrc EXIT
          rm -f .npmrc
          printf '%s\n' \
            '@voho0000:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' \
            'registry=https://registry.npmjs.org/' > .npmrc
          npm ci --ignore-scripts

      - name: Rebuild app dependencies
        working-directory: app
        run: npm rebuild

      - name: Inject HMC personalization source packages
        env:
          APP_SHA: ${{ needs.resolve.outputs.app_sha }}
          PERSONALIZATION_SHA: ${{ needs.resolve.outputs.personalization_sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { access, cp, mkdir, readdir, readFile, rm, writeFile } from 'node:fs/promises'
          import path from 'node:path'

          const packageRoot = path.resolve('personalization', 'packages')
          const packageDirs = (await readdir(packageRoot, { withFileTypes: true }))
            .filter((entry) => entry.isDirectory())
            .map((entry) => entry.name)
            .sort()
          if (packageDirs.length === 0) throw new Error('No personalization source packages found')

          // The personalization main branch is the active HF development slice.
          // The published package remains the compatibility baseline for the other
          // diseases the app still ships. Keep its cross-disease entry points and
          // registries, then overlay the HF source files from pilot/hmc.
          const preservedPersonalizedCareFiles = [
            /^index\./,
            /^types\./,
            /^registry\./,
            /^clinical-module-catalog\./,
            /^clinical-modules\/(?:evidence-tables|registry)\./,
            /^guideline-packs\/bundled\./,
            /^knowledge-packs\/registry\./,
          ]

          const packageVersions = {}

          for (const packageDir of packageDirs) {
            const source = path.join(packageRoot, packageDir)
            const manifest = JSON.parse(await readFile(path.join(source, 'package.json'), 'utf8'))
            const expectedName = `@voho0000/${packageDir}`
            if (manifest.name !== expectedName) {
              throw new Error(`Unexpected package name at ${source}: ${manifest.name}`)
            }
            await access(path.join(source, 'dist', 'index.js'))

            const target = path.resolve('app', 'node_modules', '@voho0000', packageDir)
            if (packageDir === 'personalized-care') {
              const sourceDist = path.join(source, 'dist')
              const targetDist = path.join(target, 'dist')
              await access(path.join(target, 'package.json'))
              await cp(sourceDist, targetDist, {
                recursive: true,
                filter: (sourcePath) => {
                  const relativePath = path.relative(sourceDist, sourcePath)
                  return relativePath === '' || !preservedPersonalizedCareFiles.some(
                    (pattern) => pattern.test(relativePath),
                  )
                },
              })
            } else {
              await rm(target, { recursive: true, force: true })
              await mkdir(target, { recursive: true })
              await cp(path.join(source, 'package.json'), path.join(target, 'package.json'))
              await cp(path.join(source, 'dist'), path.join(target, 'dist'), { recursive: true })
            }
            packageVersions[manifest.name] = manifest.version
          }

          const buildInfo = {
            preview: 'HMC',
            appRef: 'pilot/hmc',
            appSha: process.env.APP_SHA,
            personalizationRef: 'pilot/hmc',
            personalizationSha: process.env.PERSONALIZATION_SHA,
            packageVersions,
            builtAt: new Date().toISOString(),
          }
          await writeFile(
            path.resolve('app', 'public', 'hmc-build.json'),
            `${JSON.stringify(buildInfo, null, 2)}\n`,
          )
          NODE

      - name: Verify HMC care overlay
        working-directory: app
        shell: bash
        run: |
          node <<'NODE'
          const { CARE_PACKS } = require('@voho0000/personalized-care')
          const { HEART_FAILURE_GUIDELINE_PACK: sourceHeartFailure } = require(
            '../personalization/packages/personalized-care/dist/guideline-packs/heart-failure-pack.js'
          )

          const installedHeartFailure = CARE_PACKS.find((pack) => pack.id === 'heart-failure-cdss')
          const installedCkd = CARE_PACKS.find((pack) => pack.id === 'ckd-cdss')
          if (!installedHeartFailure || !installedCkd) {
            throw new Error('HMC overlay must retain both heart-failure and CKD care packs')
          }
          for (const field of ['id', 'version', 'enabled']) {
            if (installedHeartFailure[field] !== sourceHeartFailure[field]) {
              throw new Error(`HMC heart-failure ${field} does not match pilot source`)
            }
          }
          if (installedHeartFailure.label.zh !== sourceHeartFailure.label.zh
            || installedHeartFailure.label.en !== sourceHeartFailure.label.en) {
            throw new Error('HMC heart-failure label does not match pilot source')
          }
          NODE

      - name: Typecheck HMC app
        working-directory: app
        run: npx tsc --noEmit

      - name: Lint HMC app
        working-directory: app
        run: npm run lint

      - name: Test HMC app
        working-directory: app
        # These three suites assert the released package's HF title and pilot
        # gate. The HMC source intentionally replaces those values; its own
        # verify suite and the overlay smoke check above cover that boundary.
        run: npm test -- --ci --passWithNoTests --testPathIgnorePatterns="worktrees|__tests__/features/clinical-decision-support/(LiveFeature|package-wiring|pilot-pack-registry)[.]test[.]tsx?$"

      - name: Build static HMC preview
        working-directory: app
        env:
          DEPLOY_BASE_PATH: "/app-hmc"
          TAILWIND_DISABLE_LIGHTNINGCSS: "true"
          NEXT_PUBLIC_CHAT_URL: ${{ vars.NEXT_PUBLIC_CHAT_URL }}
          NEXT_PUBLIC_WHISPER_URL: ${{ vars.NEXT_PUBLIC_WHISPER_URL }}
          NEXT_PUBLIC_GEMINI_URL: ${{ vars.NEXT_PUBLIC_GEMINI_URL }}
          NEXT_PUBLIC_CLAUDE_URL: ${{ vars.NEXT_PUBLIC_CLAUDE_URL }}
          NEXT_PUBLIC_OPENAI_COMPATIBLE_GATEWAY_URL: ${{ vars.NEXT_PUBLIC_OPENAI_COMPATIBLE_GATEWAY_URL }}
          NEXT_PUBLIC_PROXY_KEY: ${{ vars.NEXT_PUBLIC_PROXY_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_APPCHECK_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_APPCHECK_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_PERPLEXITY_PROXY_URL: ${{ vars.NEXT_PUBLIC_PERPLEXITY_PROXY_URL }}
          NEXT_PUBLIC_FEEDBACK_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_URL }}
        shell: bash
        run: |
          restore_api() {
            if [ -d .api-stash-hmc-build ]; then
              mv .api-stash-hmc-build app/api
            fi
          }
          trap restore_api EXIT
          if [ -d app/api ]; then
            mv app/api .api-stash-hmc-build
          fi
          npx next build

      - name: Upload static preview
        uses: actions/upload-artifact@v7
        with:
          name: hmc-preview-${{ needs.resolve.outputs.app_sha }}
          path: app/out/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mediprisma-site-publish
    steps:
      - name: Download verified static preview
        uses: actions/download-artifact@v8
        with:
          name: hmc-preview-${{ needs.resolve.outputs.app_sha }}
          path: preview

      - name: Verify preview revisions
        env:
          APP_SHA: ${{ needs.resolve.outputs.app_sha }}
          PERSONALIZATION_SHA: ${{ needs.resolve.outputs.personalization_sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const marker = JSON.parse(await readFile('preview/hmc-build.json', 'utf8'))
          if (marker.appSha !== process.env.APP_SHA) {
            throw new Error(`Preview app SHA mismatch: ${marker.appSha}`)
          }
          if (marker.personalizationSha !== process.env.PERSONALIZATION_SHA) {
            throw new Error(`Preview personalization SHA mismatch: ${marker.personalizationSha}`)
          }
          NODE

      - name: Checkout mediprisma.tw site
        uses: actions/checkout@v7
        with:
          repository: voho0000/mediprisma-site
          ssh-key: ${{ secrets.MEDIPRISMA_SITE_DEPLOY_KEY }}
          path: docs-site
          ref: main

      - name: Publish /app-hmc to the site repository
        env:
          APP_SHA: ${{ needs.resolve.outputs.app_sha }}
          PERSONALIZATION_SHA: ${{ needs.resolve.outputs.personalization_sha }}
        working-directory: docs-site
        shell: bash
        run: |
          rm -rf static/app-hmc
          mkdir -p static/app-hmc
          cp -R ../preview/. static/app-hmc/

          git config user.name "mediprisma-hmc-preview[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/app-hmc
          if git diff --cached --quiet; then
            echo "HMC preview output is unchanged."
            exit 0
          fi

          git commit -m "chore: deploy /app-hmc app@${APP_SHA:0:7} personalization@${PERSONALIZATION_SHA:0:7}"
          git push origin main
